<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ფოტო ანიმაცია</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #1a1410;
      --bg1: #2c2118;
      --ink: #f4ebe0;
      --muted: #c9b8a4;
      --accent: #e8a15a;
      --glass: rgba(255, 244, 230, 0.08);
      --line: rgba(244, 235, 224, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 15% -10%, rgba(232, 161, 90, 0.22), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(90, 140, 180, 0.14), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #120e0b);
      overflow-x: hidden;
    }

    .wrap {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 2rem;
      animation: rise 0.9s ease both;
    }

    h1 {
      font-family: "Noto Serif Georgian", Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header p {
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .stage {
      position: relative;
      border-radius: 1.25rem;
      overflow: hidden;
      isolation: isolate;
      background: #0a0806;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px var(--line);
      aspect-ratio: 3 / 4;
      max-height: min(78vh, 860px);
      margin-inline: auto;
      width: min(100%, 520px);
      animation: rise 1.1s ease 0.08s both;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hud {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: linear-gradient(to top, rgba(10, 8, 6, 0.78), transparent);
    }

    .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; }

    button, label.btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    button:hover, label.btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 244, 230, 0.14);
      border-color: rgba(232, 161, 90, 0.5);
    }

    button.primary {
      background: linear-gradient(135deg, #efb072, #d4833d);
      color: #1a120a;
      border-color: transparent;
    }

    input[type="file"] { display: none; }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .panel {
      margin-top: 1.75rem;
      display: grid;
      gap: 1rem;
      animation: rise 1.2s ease 0.16s both;
    }

    .sliders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.9rem;
    }

    .slider {
      padding: 0.95rem 1rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: rgba(255, 244, 230, 0.04);
    }

    .slider label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.55rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 1.25rem, 1100px); padding-top: 1.5rem; }
      .hud { flex-direction: column; align-items: stretch; }
      .actions { justify-content: stretch; }
      button, label.btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ფოტო ანიმაცია</h1>
      <p>ატვირთე ფოტო და გადააქციე ცოცხალ კადრად — ნელი ზუმი, ოქროს შუქი და კვამლის ნაზი მოძრაობა.</p>
    </header>

    <div class="stage">
      <canvas id="stage" width="720" height="1080" aria-label="ანიმირებული ფოტო"></canvas>
      <div class="hud">
        <div class="actions">
          <label class="btn primary">
            ფოტოს ატვირთვა
            <input id="file" type="file" accept="image/*" />
          </label>
          <button id="toggle" type="button">პაუზა</button>
          <button id="place" type="button">კვამლის ადგილი</button>
          <button id="download" type="button">ჩაწერა</button>
        </div>
        <div class="meta" id="status">დემო ფოტო იტვირთება…</div>
      </div>
    </div>

    <section class="panel">
      <div class="sliders">
        <div class="slider">
          <label><span>კვამლი</span><span id="smokeVal">1.0</span></label>
          <input id="smoke" type="range" min="0" max="2" step="0.05" value="1" />
        </div>
        <div class="slider">
          <label><span>ზუმი</span><span id="zoomVal">1.12</span></label>
          <input id="zoom" type="range" min="1" max="1.25" step="0.01" value="1.12" />
        </div>
        <div class="slider">
          <label><span>შუქი</span><span id="lightVal">1.0</span></label>
          <input id="light" type="range" min="0" max="2" step="0.05" value="1" />
        </div>
      </div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d", { alpha: false });
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file");
    const toggleBtn = document.getElementById("toggle");
    const placeBtn = document.getElementById("place");
    const downloadBtn = document.getElementById("download");
    const smokeInput = document.getElementById("smoke");
    const zoomInput = document.getElementById("zoom");
    const lightInput = document.getElementById("light");

    let img = new Image();
    let playing = true;
    let start = performance.now();
    let particles = [];
    let smokeOrigin = { x: 0.333, y: 0.588 }; // demo photo: raised hand / cigarette tip
    let mediaRecorder = null;
    let recording = false;
    let placing = false;

    function resizeCanvasToImage() {
      if (!img.naturalWidth) return;
      const maxW = 720;
      const scale = Math.min(1, maxW / img.naturalWidth);
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
    }

    function makeParticles(count) {
      particles = Array.from({ length: count }, () => resetParticle({}, true));
    }

    function resetParticle(p, initial = false) {
      const ox = smokeOrigin.x * canvas.width;
      const oy = smokeOrigin.y * canvas.height;
      p.x = ox + (Math.random() - 0.5) * 12;
      p.y = oy + (Math.random() - 0.5) * 8;
      p.vx = -0.15 + Math.random() * 0.4;
      p.vy = -0.7 - Math.random() * 0.9;
      p.life = initial ? Math.random() : 0;
      p.max = 1.8 + Math.random() * 2.2;
      p.size = 8 + Math.random() * 16;
      p.phase = Math.random() * Math.PI * 2;
      return p;
    }

    function estimateSmokeOrigin(image) {
      // Approximate hand/cigarette region for typical cafe portrait framing
      smokeOrigin = { x: 0.58, y: 0.50 };
      const probe = document.createElement("canvas");
      const pw = 120, ph = 160;
      probe.width = pw; probe.height = ph;
      const pctx = probe.getContext("2d");
      pctx.drawImage(image, 0, 0, pw, ph);
      const data = pctx.getImageData(0, 0, pw, ph).data;
      let best = -1e9, bx = 0.58, by = 0.5;
      for (let y = Math.floor(ph * 0.38); y < Math.floor(ph * 0.62); y++) {
        for (let x = Math.floor(pw * 0.45); x < Math.floor(pw * 0.78); x++) {
          const i = (y * pw + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if (r > 140 && r > g + 15 && r > b + 20) {
            const score = (r - g) * 1.4 + (r - b) * 0.8;
            if (score > best) {
              best = score;
              bx = x / pw;
              by = y / ph;
            }
          }
        }
      }
      if (best > 10) smokeOrigin = { x: bx, y: by - 0.01 };
    }

    function easeInOut(t) {
      return 0.5 - 0.5 * Math.cos(Math.PI * t);
    }

    function drawFrame(now) {
      if (!img.naturalWidth) return;
      const tSec = (now - start) / 1000;
      const loop = 8;
      const t = easeInOut((tSec % loop) / loop);
      const zoomTo = Number(zoomInput.value);
      const zoom = 1 + (zoomTo - 1) * t;
      const lightAmt = Number(lightInput.value);
      const smokeAmt = Number(smokeInput.value);

      const cw = canvas.width, ch = canvas.height;
      const sw = img.naturalWidth / zoom;
      const sh = img.naturalHeight / zoom;
      const sx = (img.naturalWidth - sw) * (0.35 - 0.17 * t);
      const sy = (img.naturalHeight - sh) * (0.42 - 0.20 * t);

      ctx.save();
      ctx.fillStyle = "#0a0806";
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);

      // Golden shimmer overlay
      const pulse = 0.5 + 0.5 * Math.sin(tSec * Math.PI * 0.7);
      ctx.globalCompositeOperation = "soft-light";
      ctx.fillStyle = `rgba(232, 161, 90, ${0.08 * lightAmt * pulse})`;
      ctx.fillRect(0, 0, cw, ch);
      ctx.globalCompositeOperation = "source-over";

      // Smoke
      if (smokeAmt > 0.01) {
        ctx.save();
        for (const p of particles) {
          p.life += 1 / 60;
          if (p.life >= p.max) resetParticle(p);
          p.phase += 0.04;
          p.x += p.vx + Math.sin(p.phase) * 0.25;
          p.y += p.vy;
          p.size *= 1.008;
          const progress = p.life / p.max;
          const alpha = (1 - progress) ** 1.2 * 0.48 * smokeAmt;
          if (alpha < 0.01) continue;
          const r = p.size * (0.55 + 0.7 * progress);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          g.addColorStop(0, `rgba(230,232,236,${alpha})`);
          g.addColorStop(1, "rgba(230,232,236,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.restore();
    }

    function loop(now) {
      if (playing) drawFrame(now);
      requestAnimationFrame(loop);
    }

    function loadImage(src, label) {
      statusEl.textContent = "იტვირთება…";
      img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        resizeCanvasToImage();
        if (!label.startsWith("დემო")) {
          estimateSmokeOrigin(img);
        }
        makeParticles(56);
        start = performance.now();
        statusEl.textContent = label;
        drawFrame(start);
      };
      img.onerror = () => {
        statusEl.textContent = "ფოტო ვერ ჩაიტვირთა";
      };
      img.src = src;
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadImage(url, file.name);
    });

    toggleBtn.addEventListener("click", () => {
      playing = !playing;
      toggleBtn.textContent = playing ? "პაუზა" : "დაკვრა";
      if (playing) start = performance.now() - ((performance.now() - start) % 8000);
    });

    placeBtn.addEventListener("click", () => {
      placing = !placing;
      placeBtn.textContent = placing ? "დააკლიკე კანვასს" : "კვამლის ადგილი";
      statusEl.textContent = placing
        ? "დააკლიკე იქ, საიდანაც კვამლი უნდა ამოდიოდეს"
        : "მზადაა";
    });

    canvas.addEventListener("click", (e) => {
      if (!placing) return;
      const rect = canvas.getBoundingClientRect();
      smokeOrigin = {
        x: (e.clientX - rect.left) / rect.width,
        y: (e.clientY - rect.top) / rect.height,
      };
      makeParticles(56);
      placing = false;
      placeBtn.textContent = "კვამლის ადგილი";
      statusEl.textContent = `კვამლი: ${(smokeOrigin.x * 100).toFixed(0)}% × ${(smokeOrigin.y * 100).toFixed(0)}%`;
    });

    downloadBtn.addEventListener("click", async () => {
      if (recording || !img.naturalWidth) return;
      recording = true;
      downloadBtn.textContent = "იწერება…";
      const stream = canvas.captureStream(30);
      const chunks = [];
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "photo-animation.webm";
        a.click();
        recording = false;
        downloadBtn.textContent = "ჩაწერა";
        statusEl.textContent = "ვიდეო მზადაა";
      };
      mediaRecorder.start();
      const wasPlaying = playing;
      playing = true;
      setTimeout(() => {
        mediaRecorder.stop();
        playing = wasPlaying;
        toggleBtn.textContent = playing ? "პაუზა" : "დაკვრა";
      }, 6000);
    });

    for (const [input, labelId] of [
      [smokeInput, "smokeVal"],
      [zoomInput, "zoomVal"],
      [lightInput, "lightVal"],
    ]) {
      const label = document.getElementById(labelId);
      input.addEventListener("input", () => {
        label.textContent = Number(input.value).toFixed(2);
      });
    }

    loadImage("./cafe-photo.png", "დემო · კაფეს კადრი");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
